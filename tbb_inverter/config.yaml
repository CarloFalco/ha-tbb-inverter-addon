name: "TBB Inverter Reader"
version: "1.3.3"
slug: "tbb_inverter"
description: "Lettura e controllo via RS485/MQTT dell'inverter TBB RiiO Sun II, con creazione automatica delle entita' in Home Assistant"
url: "https://github.com/CarloFalco/ha-tbb-inverter-addon/tree/main/tbb_inverter"
arch:
  - aarch64
  - amd64
init: false
uart: true
startup: services
# Richiede (senza imporre) il broker MQTT di Home Assistant: se `mqtt_host` e'
# vuoto, host e credenziali vengono presi automaticamente da qui.
services:
  - mqtt:want
options:
  serial_port: "/dev/ttyUSB0"
  baudrate: 9600
  poll_interval: 30
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_prefix: "tbb/inverter"
  mqtt_discovery: true
  discovery_prefix: "homeassistant"
  allow_raw_command: false
  strict_crc: false
  diag_frames: false
  smartport_register_unit: "ampere"
  smartport_a_at_zero: 5
  smartport_min_a: 5
  smartport_max_a: 32
  smartport_voltage: 230
  log_level: "info"
schema:
  serial_port: str
  baudrate: int(300,115200)
  poll_interval: int(1,3600)
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_prefix: str
  mqtt_discovery: bool
  discovery_prefix: str
  allow_raw_command: bool
  strict_crc: bool
  diag_frames: bool
  smartport_register_unit: list(ampere|percent)
  smartport_a_at_zero: int(0,65535)
  smartport_min_a: int(0,65535)
  smartport_max_a: int(1,65535)
  smartport_voltage: int(1,1000)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
