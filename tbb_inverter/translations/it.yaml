configuration:
  serial_port:
    name: Porta seriale
    description: >-
      Percorso dell'adattatore USB-RS485. Preferisci un percorso stabile
      /dev/serial/by-id/... : /dev/ttyUSB0 puo' cambiare al riavvio.
  baudrate:
    name: Baudrate
    description: Velocita' della linea RS485. L'inverter usa 9600.
  poll_interval:
    name: Intervallo di polling
    description: >-
      Secondi di pausa tra un ciclo di lettura e il successivo. 5 e' un buon
      compromesso; valori bassi aumentano le scritture nel database.
  mqtt_host:
    name: Host MQTT
    description: >-
      Lascia vuoto per usare automaticamente il broker configurato in Home
      Assistant. Compilalo solo per un broker esterno.
  mqtt_port:
    name: Porta MQTT
    description: Usata solo se hai compilato l'host MQTT.
  mqtt_user:
    name: Utente MQTT
    description: Usato solo se hai compilato l'host MQTT.
  mqtt_password:
    name: Password MQTT
    description: Usata solo se hai compilato l'host MQTT.
  mqtt_prefix:
    name: Prefisso dei topic
    description: Prefisso di tutti i topic pubblicati e dei comandi in ingresso.
  mqtt_discovery:
    name: Creazione automatica delle entita'
    description: >-
      Pubblica i messaggi di MQTT Discovery: sensori e slider SmartPort
      compaiono da soli come un unico dispositivo, senza YAML.
  discovery_prefix:
    name: Prefisso di Discovery
    description: >-
      Cambialo solo se hai personalizzato il prefisso di discovery
      dell'integrazione MQTT. Default: homeassistant.
  allow_raw_command:
    name: Consenti frame RS485 grezzi
    description: >-
      Abilita il topic cmd/raw, che scrive direttamente nei registri
      dell'inverter. Tienilo disattivo se non ti serve.
  strict_crc:
    name: Verifica CRC rigorosa
    description: >-
      Scarta le risposte il cui CRC non e' valido invece di provare comunque a
      decodificarle. Attivalo solo dopo aver visto nel log che la verifica CRC
      funziona sul tuo inverter.
  smartport_register_unit:
    name: SmartPort - significato del registro
    description: >-
      Cosa contiene il registro 0x005E. "ampere": il numero scritto sono
      direttamente gli ampere (scrivere 20 imposta 20 A) -- e' il
      comportamento osservato sul RiiO Sun II. "percent": il registro e' una
      percentuale 0-100 mappata sull'intervallo definito qui sotto. Se lo
      slider in ampere imposta una corrente diversa da quella richiesta,
      prova l'altra modalita'.
  smartport_a_at_zero:
    name: SmartPort - ampere a 0 %
    description: >-
      Corrente corrispondente al valore 0 del registro. Metti 0 se la
      percentuale dell'inverter e' riferita al fondoscala (50 % = meta' della
      corrente massima), oppure la corrente minima se e' riferita
      all'intervallo utile. Vedi la verifica nella documentazione.
  smartport_min_a:
    name: SmartPort - corrente minima
    description: >-
      Estremo inferiore ammesso dall'inverter per la SmartPort, in ampere.
      Sul RiiO Sun II sono 5 A.
  smartport_max_a:
    name: SmartPort - corrente massima
    description: >-
      Estremo superiore ammesso dall'inverter per la SmartPort, in ampere.
      Sul RiiO Sun II sono 32 A.
  smartport_voltage:
    name: SmartPort - tensione nominale
    description: >-
      Tensione usata per convertire gli ampere in watt nello slider in W.
      Fissa e non misurata, cosi' il valore impostato resta stabile.
  log_level:
    name: Livello di log
    description: >-
      info mostra la tabella dei valori ad ogni ciclo e i frame delle
      scritture SmartPort, notice solo gli eventi, debug aggiunge i frame
      esadecimali di ogni lettura.
network: {}
