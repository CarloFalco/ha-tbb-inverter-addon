name: Build add-on

# Compila l'immagine dell'add-on per ogni architettura e la pubblica su GHCR.
#
# L'immagine base NON e' definita qui ma nel Dockerfile (`ARG BUILD_FROM`), che
# e' anche quello che usa il Supervisor quando un utente installa l'add-on da
# sorgente: una sola fonte di verita', nessun rischio che CI e installazione
# locale partano da basi diverse.
#
# Dopo la prima esecuzione riuscita puoi aggiungere in tbb_inverter/config.yaml:
#     image: "ghcr.io/carlofalco/{arch}-tbb-inverter"
# cosi' gli utenti scaricano l'immagine gia' pronta invece di compilarla.

on:
  push:
    branches: [main]
    paths:
      - "tbb_inverter/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    paths:
      - "tbb_inverter/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

jobs:
  info:
    name: Prepara
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Leggi versione e prefisso registry
        id: meta
        run: |
          version=$(grep -oP '^version:\s*"\K[^"]+' tbb_inverter/config.yaml)
          [ -n "${version}" ] || { echo "::error::versione non trovata in config.yaml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # GHCR accetta solo nomi minuscoli, il proprietario del repo no.
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Versione add-on: ${version}"

      - name: Costruisci la matrice di build
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: tbb-inverter
          registry-prefix: ${{ steps.meta.outputs.prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: info
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.info.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build & push
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.info.outputs.version }}
            latest
          version: ${{ needs.info.outputs.version }}
          context: ./tbb_inverter
          # Sulle pull request si compila soltanto, senza pubblicare.
          push: ${{ github.event_name != 'pull_request' }}
          cosign: false
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
