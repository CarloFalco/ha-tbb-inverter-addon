name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  addon-config:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate config.yaml
        uses: frenck/action-app-linter@v2.21.1
        with:
          path: "./tbb_inverter"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 perche' il test di regressione confronta i frame emessi
      # con quelli di un commit precedente, letto direttamente da git.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check tbb_inverter/ tests/
      - name: Compile check
        run: python -m compileall -q tbb_inverter/
      - name: Install runtime deps
        run: pip install -r tbb_inverter/requirements.txt
      - name: Run tests
        run: python tests/test_reader.py
      - name: Run stability & security tests
        run: python tests/test_stability.py
      - name: Run SmartPort regression test
        run: python tests/test_regressione_smartport.py

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1008 -e SC2034
        with:
          scandir: "./tbb_inverter"
